[package]
name = "hall-standin"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Stand-in for reeve's listing: serves the listing (version 1) hall reads, from a test reeve home."

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = { version = "0.25", features = ["serde"] }
