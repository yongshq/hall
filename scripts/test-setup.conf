# Test setup inputs, sourced by scripts/test-setup and scripts/test-drive.
# Flags override them: --home, --session, or --config <file> for another file
# of this shape. The scripts have no built-in defaults: these values are the
# only defaults allowed (ADR 0003), and every run prints them.

# The test reeve home. Never ~/.reeve.
HALL_DEV_HOME="$HOME/.reeve-hall-dev"

# The one test hall session (decision 38), run by the debug hall. Never default.
HALL_DEV_SESSION=hall-dev

# The test reeves and test hands, one line each:
#   reeve  <name>
#   errand <id>   <owner reeve> <office>
# `up` seeds <home>/standin/world.toml from this when it does not exist yet,
# starts one claude session per line (a test reeve in a workspace of its own, a
# test hand as a tab in its owner's workspace), and records where each one sits.
HALL_DEV_ROSTER=(
  "reeve ansel"
  "reeve bertil"
  "errand ansel-fix ansel artificer"
  "errand ansel-review ansel warden"
  "errand bertil-probe bertil artificer"
)

# Which listing the reeve tree reads (--listing overrides it):
#   standin  the stand-in's, from <home>/standin/world.toml, with every roster
#            line above placed by the scripts;
#   reeve    reeve's own listing command below, run on the test home, with only
#            the one test reeve in HALL_DEV_REEVE_ROSTER started and no test hand
#            placed: the test reeve dispatches its hands itself, through reeve's
#            hall backend (plan step 5, decision 68).
HALL_DEV_LISTING=standin
HALL_DEV_REEVE_LISTING="$HOME/yongshq/reeve/bin/reeve-listing"
HALL_DEV_REEVE_ROSTER=(
  "reeve ansel"
)
