# Test setup inputs, sourced by scripts/test-setup and scripts/test-drive.
# Flags override them: --home, --session-1, --session-2, or --config <file>
# for another file of this shape. The scripts have no built-in defaults: these
# values are the only defaults allowed (ADR 0003), and every run prints them.

# The test reeve home. Never ~/.reeve.
HALL_DEV_HOME="$HOME/.reeve-hall-dev"

# The two test herdr sessions. Never default.
HALL_DEV_SESSION_1=hall-dev
HALL_DEV_SESSION_2=hall-dev-2

# The test reeves and test hands, one line each:
#   reeve  <name> <herdr session: 1 or 2>
#   errand <id>   <herdr session: 1 or 2> <owner reeve> <office>
# `up` seeds <home>/standin/world.toml from this when it does not exist yet,
# starts one claude session per line, and records where each one sits.
HALL_DEV_ROSTER=(
  "reeve ansel 1"
  "reeve bertil 2"
  "errand ansel-fix 1 ansel artificer"
  "errand ansel-review 2 ansel warden"
  "errand bertil-probe 2 bertil artificer"
)
